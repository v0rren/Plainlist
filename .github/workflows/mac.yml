name: macOS

# Costruisce la versione Mac su un Mac di GitHub (gratis per i repository pubblici).
# Il .dmg si scarica dalla pagina della singola esecuzione, in "Artifacts";
# con un tag v* viene allegato anche alla release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish never

      - name: Controlla l'app impacchettata
        run: |
          APP="dist/mac-arm64/Plainlist.app"
          # Firma ad-hoc valida: senza, i Mac Apple Silicon non avviano l'app.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # SQLite si carica dal pacchetto (binario darwin-arm64 incluso e non bloccato).
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Plainlist" -e \
            "const D = require(process.argv[1] + '/node_modules/better-sqlite3'); console.log('SQLite', new D(':memory:').prepare('select sqlite_version() as v').get().v)" \
            "$APP/Contents/Resources/app.asar"
          # L'app parte e resta aperta.
          "$APP/Contents/MacOS/Plainlist" &
          PID=$!
          sleep 20
          if ! kill -0 "$PID"; then
            echo "L'app si è chiusa da sola"
            exit 1
          fi
          echo "App avviata correttamente"
          kill "$PID"

      - uses: actions/upload-artifact@v4
        with:
          name: Plainlist-mac
          path: dist/*.dmg

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Plainlist ${GITHUB_REF_NAME#v}" --notes ""
