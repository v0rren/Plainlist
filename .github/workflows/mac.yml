name: macOS

# Costruisce la versione Mac su un Mac di GitHub (gratis per i repository pubblici).
# Il .dmg si scarica dalla pagina della singola esecuzione, in "Artifacts";
# con un tag v* viene allegato anche alla release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP: dist/mac-arm64/Plainlist.app

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --publish never

      # Il .dmg si carica subito, così resta scaricabile anche se un controllo successivo fallisce.
      - uses: actions/upload-artifact@v5
        with:
          name: Plainlist-mac
          path: dist/*.dmg

      # Ogni controllo è un passo a sé. In caso di errore l'output finisce in un'annotazione,
      # visibile a tutti (i log completi li vede solo chi amministra il repository).
      - name: Controllo della firma
        run: |
          if ! codesign --verify --deep --strict --verbose=2 "$APP" > check.log 2>&1; then
            echo "::error title=Firma::$(tr '\n' ' ' < check.log | tail -c 1800)"
            exit 1
          fi
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"

      - name: Controllo di SQLite nel pacchetto
        if: always()
        run: |
          if ! ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Plainlist" -e \
            "const D = require(process.argv[1] + '/node_modules/better-sqlite3'); console.log('SQLite', new D(':memory:').prepare('select sqlite_version() as v').get().v)" \
            "$GITHUB_WORKSPACE/$APP/Contents/Resources/app.asar" > check.log 2>&1; then
            echo "::error title=SQLite::$(tr '\n' ' ' < check.log | tail -c 1800)"
            exit 1
          fi
          cat check.log

      - name: Controllo dell'avvio
        if: always()
        run: |
          "$APP/Contents/MacOS/Plainlist" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2> /dev/null; then
            echo "::error title=Avvio::L'app si è chiusa da sola. $(tr '\n' ' ' < app.log | tail -c 1700)"
            exit 1
          fi
          echo "App avviata correttamente"
          kill "$PID"

      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Plainlist ${GITHUB_REF_NAME#v}" --notes ""
